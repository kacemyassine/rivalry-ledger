name: Unit and component tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [develop, main]

concurrency:
  group: unit-component-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.ref_name }}
          list-files: json
          filters: |
            all:
              - '**'

      - id: decide
        env:
          FILES: ${{ steps.filter.outputs.all_files }}
          BRANCH: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "push" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$BRANCH" = "main" ]; then
            N=$(echo "$FILES" | jq '[.[] | select(startswith("src/data/") | not)] | length')
          else
            N=$(echo "$FILES" | jq '[.[] | select((startswith("src/") and (startswith("src/data/") | not)) or startswith("tests/"))] | length')
          fi

          if [ "$N" -gt 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  jest:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - name: Run Jest with coverage
        run: npm run test:coverage -- --ci

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore