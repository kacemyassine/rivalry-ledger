name: E2E tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - 'src/data/**'

concurrency:
  group: e2e-sandbox
  cancel-in-progress: false

jobs:
  cypress:
    runs-on: ubuntu-latest
    permissions:
      contents: write


    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      
      - name: Reset e2e-sandbox from develop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(gh api repos/${{ github.repository }}/git/ref/heads/develop --jq .object.sha)
          gh api -X PATCH repos/${{ github.repository }}/git/refs/heads/e2e-sandbox -f sha="$SHA" -F force=true

      - name: Run Cypress
        uses: cypress-io/github-action@v6
        with:
          start: npm run dev:e2e
          wait-on: 'http://localhost:8080'
          wait-on-timeout: 120
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore