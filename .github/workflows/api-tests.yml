name: API tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'supabase/**'
      - 'postman/**'
  push:
    branches: [develop, main]

concurrency:
  group: api-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.ref_name }}
          list-files: json
          filters: |
            all:
              - '**'

      - id: decide
        env:
          FILES: ${{ steps.filter.outputs.all_files }}
          BRANCH: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "push" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$BRANCH" = "main" ]; then
            N=$(echo "$FILES" | jq '[.[] | select(startswith("src/data/") | not)] | length')
          else
            N=$(echo "$FILES" | jq '[.[] | select(startswith("supabase/") or startswith("postman/"))] | length')
          fi

          if [ "$N" -gt 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  newman:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Newman
        run: npm install -g newman newman-reporter-htmlextra

      - name: Run Newman
        run: |
          newman run postman/collections/rivalry-ledger-api.postman_collection.json \
            -e postman/environments/rivalry-ledger-develop.postman_environment.json \
            --env-var "anon_key=${{ secrets.ANON_KEY }}" \
            -r cli,htmlextra \
            --reporter-htmlextra-export newman-report.html

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: newman-report.html
